sor-temperature,</tspan><tspan x="158.5" dy="16.555556">mosquitto, detector,</tspan><tspan x="158.5" dy="16.555556">sprinkler-actuator,</tspan><tspan x="158.5" dy="16.555556">door-actuator</tspan></text></g><g class="bGFwdG9wLnNlcnZlcg=="><g class="shape" ><rect x="305" y="345" width="276" height="194" stroke="#000536" fill="#e5e7eb" class=" stroke-B1" style="stroke-width:2;" /></g><text x="443" y="399.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="443" dy="0">Server: off the safety path</tspan><tspan x="443" dy="16.714286">(could move off the site)</tspan><tspan x="443" dy="16.714286"> </tspan><tspan x="443" dy="16.714286">bridge, responder, dashboard,</tspan><tspan x="443" dy="16.714286">db-writer, timescaledb, grafana,</tspan><tspan x="443" dy="16.714286">prometheus, cadvisor, registry,</tspan><tspan x="443" dy="16.714286">scenario-console</tspan></text></g><g class="bGFwdG9wLndvcmxk"><g class="shape" ><rect x="611" y="345" width="237" height="194" stroke="#000536" fill="#fee2e2" class=" stroke-B1" style="stroke-width:2;" /></g><text x="729.5" y="407.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="729.5" dy="0">Simulated world</tspan><tspan x="729.5" dy="16.833333">(stands in for the building)</tspan><tspan x="729.5" dy="16.833333"> </tspan><tspan x="729.5" dy="16.833333">physics-sim, occupancysim</tspan><tspan x="729.5" dy="16.833333">[course], evac-proxy,</tspan><tspan x="729.5" dy="16.833333">buildsim [course]</tspan></text></g><g class="KGJyb3dzZXIgLSZndDsgbGFwdG9wKVswXQ=="><marker id="mk-d2-1865478490-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#000536" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 445 112 L 445 267" stroke="#000536" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1