# Local lab broker (decision D1). No authentication: everything runs on one
# laptop and is bound to loopback by docker-compose.yml. Not for deployment.
listener 1883
allow_anonymous true

# Keep sessions and queued QoS 1 messages across short client outages (NFR2/H7).
persistence true
persistence_location /mosquitto/data/
max_queued_messages 10000

log_dest stdout
